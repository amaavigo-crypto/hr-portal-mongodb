name: CI and deploy

# main        = test branch. Tested on every push and, if everything passes, deployed to the STAGING copy on the server.
# production  = live branch. Tested on every push and, if everything passes, deployed to the LIVE site on the server.
# Pull requests are tested but never deployed.
# You can also deploy manually: Actions tab > "CI and deploy" > Run workflow, choosing main or production.
on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

# Never run two deploys at the same time. A newer push waits for the running one to finish.
concurrency:
  group: hr-portal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: bash scripts/run-tests.sh

      - name: Build
        run: npm run build

  deploy-staging:
    name: Deploy to staging
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '$DEPLOY_PATH'; PREV_SHA=\$(git rev-parse HEAD); git fetch --quiet origin main; git checkout -q -f -B main '$COMMIT_SHA'; PM2_APP=hr-portal-staging APP_PORT=3001 PREV_SHA=\$PREV_SHA bash scripts/deploy.sh"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy:
    name: Deploy to server (live)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '$DEPLOY_PATH'; PREV_SHA=\$(git rev-parse HEAD); git fetch --quiet origin production; git checkout -q -f -B production '$COMMIT_SHA'; PREV_SHA=\$PREV_SHA bash scripts/deploy.sh"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key